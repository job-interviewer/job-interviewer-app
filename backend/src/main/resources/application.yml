server:
  port: ${SERVER_PORT:8080}

spring:
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:placeholder}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.7
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: INFO
    com.interview: DEBUG
